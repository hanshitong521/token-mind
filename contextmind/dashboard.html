<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextMind Dashboard</title>
<style>
	:root {
		--bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
		--dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149;
		--yellow: #d29922; --purple: #bc8cff; --mono: ui-monospace, Consolas, monospace;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
	h1 { font-size: 20px; margin-bottom: 4px; }
	h2 { font-size: 15px; margin: 28px 0 12px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
	.meta { color: var(--dim); font-size: 12px; margin-bottom: 20px; font-family: var(--mono); }
	.grid { display: grid; gap: 12px; }
	.cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
	.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
	.card .label { color: var(--dim); font-size: 12px; }
	.card .value { font-size: 26px; font-weight: 600; font-family: var(--mono); margin-top: 4px; }
	.card .value.green { color: var(--green); }
	.card .value.blue { color: var(--accent); }
	.card .value.yellow { color: var(--yellow); }
	.card .sub { color: var(--dim); font-size: 11px; margin-top: 4px; }
	table { width: 100%; border-collapse: collapse; font-size: 13px; }
	th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
	td { padding: 6px 10px; border-bottom: 1px solid #21262d; font-family: var(--mono); font-size: 12px; }
	tr:hover td { background: #1c2129; }
	.bar { height: 6px; border-radius: 3px; background: #21262d; position: relative; min-width: 80px; }
	.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--green); }
	.bar > i.b { background: var(--accent); }
	.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-family: var(--mono); }
	.badge.ok { background: #1b3a25; color: var(--green); }
	.badge.fail { background: #3d1d1f; color: var(--red); }
	.badge.dedup { background: #2a2335; color: var(--purple); }
	.badge.handle { background: #1b2f3a; color: var(--accent); }
	.badge.read { background: #3a301b; color: var(--yellow); }
	.badge.dim { background: #21262d; color: var(--dim); }
	.controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
	.controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 12px; }
	.controls button.active { border-color: var(--accent); color: var(--accent); }
	.chart { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; }
	svg text { fill: var(--dim); font-size: 10px; font-family: var(--mono); }
	.timeline-wrap { max-height: 480px; overflow-y: auto; }
	.empty { color: var(--dim); padding: 30px; text-align: center; }
	#err { color: var(--red); font-family: var(--mono); display: none; margin: 12px 0; }
</style>
</head>
<body>
<h1>ContextMind · Token 账本</h1>
<div class="meta" id="meta">loading…</div>
<div id="err"></div>

<div class="grid cards" id="cards"></div>

<h2>时间维度（时 / 日 / 周 / 月 / 年）</h2>
<div class="controls" id="period-tabs"></div>
<div class="chart" id="period-chart"></div>

<h2>按工具</h2>
<div class="chart"><table id="by-tool"></table></div>

<div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:0">
	<div style="margin-right:12px"><h2 style="margin-top:28px">按来源 surface</h2><div class="chart"><table id="by-surface"></table></div></div>
	<div><h2 style="margin-top:28px">按内容类型</h2><div class="chart"><table id="by-content"></table></div></div>
</div>

<h2>事件时间线（每次请求：几点几分 · 干了什么 · 省多少 · 缓存命中没）</h2>
<div class="chart timeline-wrap"><table id="events"></table></div>

<h2>按 Adapter（上游命令）</h2>
<div class="chart"><table id="by-adapter"></table></div>

<script>
const fmt = (n) => (n ?? 0).toLocaleString("en-US");
const pct = (r) => (r === null || r === undefined) ? "—" : (r * 100).toFixed(1) + "%";
const $ = (id) => document.getElementById(id);
let DATA = null;
let periodKey = "hour";

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function localTime(iso) {
	const d = new Date(iso);
	const pad = (x) => String(x).padStart(2, "0");
	return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function render() {
	if (!DATA) return;
	const t = DATA.totals;
	$("meta").textContent = `${DATA.project} · tokenizer ${DATA.tokenizer} · 生成于 ${localTime(DATA.generated_at)} · 每 15s 自动刷新`;
	$("cards").innerHTML = [
		card("RAW（原始）", fmt(t.raw), "blue", "本应进入模型窗口的 token"),
		card("EMITTED（实际发出）", fmt(t.emitted), "", `平均 gate 延迟 ${t.avg_gate_ms ? t.avg_gate_ms.toFixed(0) + "ms" : "—"}`),
		card("AVOIDED（节省）", fmt(t.avoided), "green", `压缩率 ${pct(t.raw > 0 ? t.avoided / t.raw : null)}`),
		card("PREVENTED READ", fmt(t.prevented), "yellow", "Read Guard 拦截（独立列，不混账）"),
		card("请求次数", fmt(t.events), "", `成功 ${t.successes} · 失败 ${t.events - t.successes}`),
		card("Handle", `${t.handles_created} 建了 / ${t.handles_fetched} 取回`, "", `dedup 命中 ${t.dedup_hits} · 拦读 ${t.reads_blocked}`),
	].join("");

	renderPeriod();
	renderGroupTable("by-tool", DATA.byTool, true);
	renderGroupTable("by-surface", DATA.bySurface);
	renderGroupTable("by-content", DATA.byContentType);
	renderGroupTable("by-adapter", DATA.byAdapter);
	renderEvents();
}

function card(label, value, cls, sub) {
	return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
}

function renderPeriod() {
	const tabs = $("period-tabs");
	tabs.innerHTML = Object.entries(DATA.periods)
		.map(([k, p]) => `<button class="${k === periodKey ? "active" : ""}" onclick="setPeriod('${k}')">${p.label}</button>`)
		.join("");
	const buckets = DATA.periods[periodKey].buckets;
	$("period-chart").innerHTML = buckets.length
		? barChart(buckets)
		: `<div class="empty">该粒度暂无数据</div>`;
}

function setPeriod(k) { periodKey = k; renderPeriod(); }

/** Hand-rolled grouped bar chart: avoided (green, stacked bottom) + emitted (blue, top). */
function barChart(buckets) {
	const W = Math.max(700, buckets.length * 90), H = 220, PAD = 34, BW = 34, GAP = 56;
	const max = Math.max(1, ...buckets.map(b => b.raw));
	const scale = (v) => (H - PAD - 18) * (v / max);
	let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
	svg += `<line x1="${PAD}" y1="${H - 18}" x2="${W - 5}" y2="${H - 18}" stroke="#30363d"/>`;
	buckets.forEach((b, i) => {
		const x = PAD + 10 + i * (BW + GAP);
		const hA = scale(b.avoided), hE = scale(b.emitted);
		const yA = H - 18 - hA, yE = yA - hE;
		svg += `<rect x="${x}" y="${yA}" width="${BW}" height="${Math.max(0, hA)}" fill="#3fb950" rx="2"><title>${esc(b.bucket)}\navoided ${fmt(b.avoided)} tok (${pct(b.ratio)})</title></rect>`;
		svg += `<rect x="${x}" y="${yE}" width="${BW}" height="${Math.max(0, hE)}" fill="#58a6ff" rx="2"><title>${esc(b.bucket)}\nemitted ${fmt(b.emitted)} tok</title></rect>`;
		svg += `<text x="${x + BW / 2}" y="${H - 5}" text-anchor="middle">${esc(b.bucket)}</text>`;
		svg += `<text x="${x + BW / 2}" y="${yE - 4}" text-anchor="end" transform="rotate(-40 ${x + BW / 2} ${yE - 4})" fill="#e6edf3">${fmt(b.avoided)}</text>`;
	});
	svg += `</svg>`;
	return svg + `<div class="sub" style="color:var(--dim);font-size:11px;margin-top:8px"><span style="color:var(--green)">■</span> 节省 (avoided)&nbsp;&nbsp;<span style="color:var(--accent)">■</span> 实际发出 (emitted)&nbsp;&nbsp;悬停看明细</div>`;
}

function renderGroupTable(id, rows, withRatio) {
	const el = $(id);
	if (!rows || !rows.length) { el.innerHTML = `<div class="empty">暂无数据</div>`; return; }
	let html = `<tr><th>${id.includes("tool") ? "工具" : id.includes("surface") ? "来源" : id.includes("content") ? "内容类型" : "adapter"}</th><th>次数</th><th>raw</th><th>emitted</th><th>节省</th>${withRatio ? "<th>压缩率</th>" : ""}<th style="width:25%">占 raw 比例</th></tr>`;
	for (const r of rows) {
		const share = DATA.totals.raw > 0 ? r.raw / DATA.totals.raw : 0;
		html += `<tr><td>${esc(r.key)}</td><td>${fmt(r.events)}</td><td>${fmt(r.raw)}</td><td>${fmt(r.emitted)}</td><td style="color:var(--green)">${fmt(r.avoided)}</td>${withRatio ? `<td>${pct(r.ratio)}</td>` : ""}<td><div class="bar"><i style="width:${(share * 100).toFixed(1)}%"></i></div></td></tr>`;
	}
	el.innerHTML = html;
}

function renderEvents() {
	const el = $("events");
	if (!DATA.events.length) { el.innerHTML = `<div class="empty">暂无事件</div>`; return; }
	let html = `<tr><th>时间</th><th>工具</th><th>干了什么</th><th>raw → emitted</th><th>节省</th><th>标记</th></tr>`;
	for (const e of DATA.events) {
		const badges = [];
		if (e.dedup_hit) badges.push(`<span class="badge dedup">dedup 命中</span>`);
		if (e.handle_created) badges.push(`<span class="badge handle">handle ${esc(e.handle_id)}</span>`);
		if (e.handle_fetched) badges.push(`<span class="badge handle">取回 ${esc(e.handle_id)}</span>`);
		if (e.read_blocked) badges.push(`<span class="badge read">拦截读取</span>`);
		if (e.success === 0) badges.push(`<span class="badge fail">失败</span>`);
		else if (e.success === 1 && !badges.length) badges.push(`<span class="badge ok">成功</span>`);
		if (e.adapter_missing) badges.push(`<span class="badge fail">缺 ${esc(e.adapter_missing)}</span>`);
		const what = e.adapter_used || e.note || e.surface;
		html += `<tr>
			<td>${localTime(e.ts)}</td>
			<td>${esc(e.tool_name ?? "—")}</td>
			<td style="font-family:var(--mono);font-size:11px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(what)}">${esc(what)}</td>
			<td>${fmt(e.raw_tokens)} → ${fmt(e.emitted_tokens)}</td>
			<td style="color:var(--green)">${e.tool_emitted_savings ? fmt(e.tool_emitted_savings) : (e.prevented_read_tokens ? "(" + fmt(e.prevented_read_tokens) + " 防读)" : "—")}</td>
			<td>${badges.join(" ")}</td></tr>`;
	}
	el.innerHTML = html;
}

async function load() {
	try {
		const res = await fetch("/api/data");
		if (!res.ok) throw new Error(`HTTP ${res.status}`);
		DATA = await res.json();
		$("err").style.display = "none";
		render();
	} catch (err) {
		$("err").style.display = "block";
		$("err").textContent = `加载失败: ${err}（dashboard 进程可能已退出）`;
	}
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
